<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>恋爱小测验 · 你会怎么谈恋爱</title>
<meta name="description" content="测测你会不会恋爱、什么时候恋爱、恋爱后像哪个角色">
<link rel="preload" href="fonts/kuaile-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/wenkai-sub.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="art.css">
</head><body>
<div id="app">
  <section id="start" class="page show">
    <span class="dd" data-ic="star" style="top:8px;left:6px;width:30px;transform:rotate(-14deg)"></span>
    <span class="dd" data-ic="flower" style="top:44px;right:10px;width:34px"></span>
    <span class="dd" data-ic="spark" style="top:196px;left:0;width:22px"></span>
    <div class="envelope" data-ic="envelope" data-size="110"></div>
    <h1 class="title"><span class="t-a">恋爱</span><span class="t-b">小测验</span></h1>
    <p class="sub">会不会恋爱？什么时候恋爱？<br>恋爱后的你，像哪个<span class="hl-y">角色</span>？</p>
    <p class="pick">两种画风，两种测法，选一个吧</p>
    <button class="mode serious" data-mode="serious"><span class="tape"></span><span class="mi" data-ic="lens" data-t="s" data-size="46"></span><span class="mt"><b>认真分析</b><small>真实场景 · 尽量严谨</small></span></button>
    <button class="mode funny" data-mode="funny"><span class="tape"></span><span class="mi" data-ic="popper" data-t="f" data-size="46"></span><span class="mt"><b>搞怪测一测</b><small>脑洞题目 · 快乐至上</small></span></button>
    <p class="tiny">共 10 题 · 约 2 分钟 · 结果仅供娱乐</p>
    <a id="themeLink" class="theme-link" href="?theme=vangogh"><span data-ic="sunflower" data-t="v" data-size="22"></span><span id="themeText">试试梵高星空版</span></a>
  </section>
  <section id="quiz" class="page">
    <div class="top"><span id="modeTag" class="chip"></span><span id="count" class="count"></span></div>
    <div class="track"><i id="barIn"></i><span id="pen" class="pen"></span></div>
    <div class="qcard" id="qcard">
      <span class="dd qdeco" id="qdeco"></span>
      <div id="qdim" class="qdim"></div><h2 id="qtext"></h2><div id="opts"></div>
    </div>
    <button id="back" class="link">← 上一题</button>
  </section>
  <section id="result" class="page">
    <div id="card" class="card"></div>
    <div class="actions">
      <button id="save" class="btn main"><span id="camIc"></span>保存结果图</button>
      <button id="other" class="btn"></button>
      <button id="again" class="link">重新测一次</button>
    </div>
    <div id="preview" class="preview hide">
      <div class="pv-tip">长按图片，保存到相册</div>
      <div class="polaroid"><img id="previewImg" alt="结果图"></div>
      <button class="btn close" id="closePrev">好啦</button>
    </div>
  </section>
</div>
